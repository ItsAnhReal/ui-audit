[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-audit"
version = "0.1.0"
description = "Responsive UI Auditor: give your AI coding agent eyes across routes, UI states and responsive widths."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ItsAnhReal" }]
keywords = ["responsive", "layout", "audit", "playwright", "accessibility", "ai-agent", "claude-code", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = ["playwright>=1.45,<2"]

[project.urls]
Homepage = "https://github.com/ItsAnhReal/ui-audit"
Documentation = "https://github.com/ItsAnhReal/ui-audit#readme"
Source = "https://github.com/ItsAnhReal/ui-audit"
Issues = "https://github.com/ItsAnhReal/ui-audit/issues"
Changelog = "https://github.com/ItsAnhReal/ui-audit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
diff = ["Pillow>=10"]
dev = ["pytest>=8", "Pillow>=10"]

[project.scripts]
ui-audit = "ui_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ui_audit = ["probe.js", "skill/SKILL.md", "ui/*.html", "ui/*.css", "ui/*.js", "demo/*.html", "demo/*.css", "demo/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: launches a real Chromium against the demo app"]
