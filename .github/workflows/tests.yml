name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy  # files and leniency are set in pyproject.toml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - id: playwright
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-all
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium webkit firefox
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: playwright install-deps chromium webkit firefox
      - run: pytest -q -n auto --cov --cov-report=term --cov-report=xml
      - if: matrix.python-version == '3.12'
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # Unit tests and the Chromium e2e tests on the other platforms; WebKit and Firefox tests skip there.
  platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            browsers-path: ~/Library/Caches/ms-playwright
          - os: windows-latest
            browsers-path: ~/AppData/Local/ms-playwright
    env:
      # Product code names its encodings; many tests read files with the platform default.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - id: playwright
        shell: bash
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ${{ matrix.browsers-path }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: playwright install chromium
      - run: pytest -q -n auto
