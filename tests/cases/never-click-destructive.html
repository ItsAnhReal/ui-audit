<!-- expect: clean -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>case</title><style>
body { margin: 0; padding: 24px; font: 16px/1.5 sans-serif; }
button { height: 40px; margin: 0 8px 8px 0; }
.marker { width: 3000px; height: 20px; background: red; }
</style></head><body>
<!-- Controls that look like disclosures but sound destructive: state discovery must never click them.
     A click on one requests "clicked" and leaves a mark that outlives reloads: a 3000px bar, a horizontal overflow.
     "More" is the one safe disclosure, so the audit visibly looked for states. -->
<button aria-expanded="false" aria-controls="more">More</button>
<div id="more" hidden><p>More details.</p></div>
<button class="unsafe" aria-expanded="false" aria-controls="confirm">Delete account</button>
<button class="unsafe" aria-haspopup="menu">Log out</button>
<button class="unsafe" aria-haspopup="true">Abmelden</button>
<button class="unsafe" aria-expanded="false" aria-label="Konto löschen"><svg width="16" height="16"></svg></button>
<div role="tablist">
  <button role="tab" aria-selected="true">Overview</button>
  <button class="unsafe" role="tab" aria-selected="false">Remove</button>
</div>
<div id="confirm" hidden><p>Your account is gone.</p></div>
<script>
function mark(name) {
  document.title = "clicked: " + name;
  const bar = document.createElement("div");
  bar.className = "marker";
  document.body.append(bar);
}
try { if (localStorage.getItem("clicked")) mark(localStorage.getItem("clicked")); } catch (e) { /* no storage */ }
document.querySelector("[aria-controls=more]").addEventListener("click", (e) => {
  const open = e.currentTarget.getAttribute("aria-expanded") === "true";
  e.currentTarget.setAttribute("aria-expanded", String(!open));
  document.getElementById("more").hidden = open;
});
for (const el of document.querySelectorAll(".unsafe")) {
  el.addEventListener("click", () => {
    const name = el.getAttribute("aria-label") || el.textContent;
    try { localStorage.setItem("clicked", name); } catch (e) { /* no storage */ }
    fetch("clicked?" + encodeURIComponent(name)).catch(() => {});
    mark(name);
  });
}
</script>
</body></html>
