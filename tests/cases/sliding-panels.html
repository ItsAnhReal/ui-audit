<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>case</title><style>
body { margin: 0; padding: 24px; font: 16px/1.5 sans-serif; }
/* A drawer with a second menu panel parked beside the first, and a carousel caught mid-slide:
   whole panels the width of their box, moved sideways on purpose. */
.drawer { width: 260px; overflow-x: hidden; border: 1px solid #ccc; }
.panels { display: flex; }
.panel { flex: 0 0 100%; padding: 12px; box-sizing: border-box; }
.carousel { width: 300px; overflow: hidden; margin-top: 24px; }
.track { display: flex; transform: translateX(-40%); }
.slide { flex: 0 0 100%; height: 120px; background: #eef; }
</style></head><body>
<nav class="drawer"><div class="panels">
  <div class="panel"><a href="#a">Tutorial</a> <a href="#b">Blog</a></div>
  <div class="panel"><a href="#c">Back to main menu</a></div>
</div></nav>
<div class="carousel"><div class="track">
  <div class="slide">First slide with a caption</div><div class="slide">Second slide with a caption</div>
</div></div>
</body></html>
