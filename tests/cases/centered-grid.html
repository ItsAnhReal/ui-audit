<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>case</title><style>
/* Fixed grid columns wider than a phone, centred: the items stick out on both sides. One defect,
   in the grid's columns; neither the items nor the left edge are a second one. */
body { margin: 0; padding: 0 16px; font: 16px/1.5 sans-serif; }
.tiles { display: grid; grid-template-columns: repeat(2, 200px); gap: 12px; justify-content: center; }
.tiles > div { height: 120px; background: #eee; padding: 8px; box-sizing: border-box; }
</style></head><body>
<div class="tiles"><div>First tile</div><div>Second tile</div><div class="wide" style="grid-column: span 2">A wide tile</div></div>
</body></html>
